name: Marriott ポイント監視

on:
  schedule:
    # 6 時間ごと (UTC)。JST では 6:00 / 12:00 / 18:00 / 24:00 頃
    - cron: "0 21,3,9,15 * * *"
  workflow_dispatch:
    inputs:
      mock:
        description: "モックデータで実行(動作確認用)"
        type: boolean
        default: false

# 価格履歴をリポジトリにコミットするため書き込み権限が必要
permissions:
  contents: write

concurrency:
  group: marriott-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marriott-points-monitor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marriott-points-monitor/package-lock.json

      - name: 依存関係のインストール
        run: npm ci

      - name: Playwright ブラウザのインストール
        if: ${{ !inputs.mock }}
        run: npx playwright install --with-deps chromium

      - name: テスト
        run: npm test

      - name: ポイントチェック実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: node src/index.js check ${{ inputs.mock && '--mock' || '' }}

      - name: 価格履歴をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: ポイント価格スナップショットを更新"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
