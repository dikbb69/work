[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potsugami"
version = "0.1.0"
description = "ポツ神ファインダー: 田舎にポツンと佇む無名の小神社を探すツール"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
potsugami = "potsugami.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
potsugami = ["map_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
