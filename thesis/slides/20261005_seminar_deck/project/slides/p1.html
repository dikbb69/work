<h1 style="font-family:'Noto Serif JP', Georgia, serif;font-size:88px;font-weight:700;line-height:1.2;color:#F3F1EA">研究の背景・動機・問い</h1>
<p style="font-size:30px;color:#B9C3D3;line-height:1.5">系統用蓄電池への参入ブームの中で、<br>「スポット市場の裁定だけで、どれだけの蓄電池が成り立つのか」を問う</p>
<aside>最初のパートでは、研究の背景と動機、そして研究の問いをお話しします。系統用蓄電池は「来年から爆発的に増える」と言われる状況にあり、契約申込は急増しています。投資判断の観点からは、その収益の源泉が市場の価格差（裁定）なのか、市場の外からの収入なのかが重要になります。</aside>
