<p style="font-size:28px;font-weight:700;color:#F2A65A;letter-spacing:4px">PART 4 ｜ 第6・7章</p>
<h1 style="font-family:'Noto Serif JP', Georgia, serif;font-size:88px;font-weight:700;line-height:1.2;color:#F3F1EA">実証：価格形成と蓄電池の価値</h1>
<p style="font-size:30px;color:#B9C3D3;line-height:1.5">再エネは価格の「水準」と「日内形状」のどちらを動かすのか。<br>それは蓄電池の裁定価値にどう効くのか</p>
<aside>ここから実証のパートです。第6章では、太陽光と風力が電力価格の水準と日内の形状（1日の中の価格差）にそれぞれどう効くかを、記述統計、帯域分解、日次回帰、反実仮想シミュレーション、頑健性の順で確認します。第7章では、その価格の下で4時間の蓄電池がどれだけの裁定価値を得られるかを評価します。各スライドで、どのデータを、どう分析し、何が分かったかを順にお示しします。</aside>
