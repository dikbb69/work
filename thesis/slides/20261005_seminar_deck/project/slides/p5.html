<p style="font-size:28px;font-weight:700;color:#F2A65A;letter-spacing:4px">PART 5 ｜ 第8〜10章</p>
<h1 style="font-family:'Noto Serif JP', Georgia, serif;font-size:88px;font-weight:700;line-height:1.2;color:#F3F1EA">自由参入均衡・乖離・価格の下限</h1>
<p style="font-size:30px;color:#B9C3D3;line-height:1.5">スポット裁定だけで参入は成り立つのか。<br>成り立たないなら、なぜ参入が続くのか</p>
<aside>後半は、蓄電池が増えると裁定の機会自体が減っていく（自己侵食）ことを価格モデルに組み込み、スポット裁定だけで採算が取れる蓄電池の量、すなわち均衡容量を求めます。そのうえで、実際の参入量との乖離を市場外収入で分解し、最後に、価格の下限（0.01円/kWh）が蓄電池の価値と参入に果たす役割を、負の価格を許す反実仮想で評価します。</aside>
